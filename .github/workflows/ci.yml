name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  SONAR_PROJECT_KEY: CodeMaru-Dreamine_Dreamine.UI.Wpf
  SONAR_ORGANIZATION: codemaru-dreamine
  SONAR_PROJECT_VERSION: 1.0.1
  SONAR_SCANNER_VERSION: 11.2.1
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

jobs:
  build-test-sonar:
    name: Build, test, pack, and analyze
    runs-on: windows-2025

    steps:
      - name: Check out package
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: src/UI.Wpf
          fetch-depth: 0

      - name: Check out UI.Abstractions dependency
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: CodeMaru-Dreamine/Dreamine.UI.Abstractions
          path: src/UI.Abstractions
          fetch-depth: 1

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x

      - name: Install SonarScanner
        if: env.SONAR_TOKEN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: pwsh
        run: dotnet tool install --global dotnet-sonarscanner --version $env:SONAR_SCANNER_VERSION

      - name: Align SonarCloud project settings
        if: env.SONAR_TOKEN != '' && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $headers = @{
            Accept = 'application/json'
            Authorization = "Bearer $env:SONAR_TOKEN"
          }
          $project = $env:SONAR_PROJECT_KEY

          try {
            Invoke-RestMethod -Method Post -Uri "https://sonarcloud.io/api/autoscan/activation?projectKey=$project&enable=false" -Headers $headers | Out-Null
          } catch {
            Write-Host "Autoscan alignment skipped: $($_.Exception.Message)"
          }

          try {
            Invoke-RestMethod -Method Post -Uri "https://sonarcloud.io/api/qualitygates/select?projectKey=$project&gateName=Sonar%20way" -Headers $headers | Out-Null
          } catch {
            Write-Host "Quality gate alignment skipped: $($_.Exception.Message)"
          }

          try {
            Invoke-RestMethod -Method Post -Uri "https://sonarcloud.io/api/project_branches/rename?project=$project&name=main" -Headers $headers | Out-Null
          } catch {
            Write-Host "Branch alignment skipped: $($_.Exception.Message)"
          }

          try {
            Invoke-RestMethod -Method Post -Uri "https://sonarcloud.io/api/new_code_periods/set?project=$project&type=NUMBER_OF_DAYS&value=30" -Headers $headers | Out-Null
          } catch {
            Write-Host "New-code period alignment skipped: $($_.Exception.Message)"
          }

      - name: Restore
        shell: pwsh
        run: dotnet restore src/UI.Wpf/tests/Dreamine.UI.Wpf.Tests/Dreamine.UI.Wpf.Tests.csproj

      - name: Begin SonarCloud analysis
        if: env.SONAR_TOKEN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: pwsh
        run: >
          dotnet sonarscanner begin
          /k:"$env:SONAR_PROJECT_KEY"
          /o:"$env:SONAR_ORGANIZATION"
          /v:"$env:SONAR_PROJECT_VERSION"
          /d:sonar.token="$env:SONAR_TOKEN"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.projectBaseDir="${{ github.workspace }}\src\UI.Wpf"
          /d:sonar.scm.provider=git
          /d:sonar.sourceEncoding=UTF-8
          /d:sonar.cs.opencover.reportsPaths="$env:RUNNER_TEMP\TestResults\**\coverage.opencover.xml"
          /d:sonar.cs.vstest.reportsPaths="$env:RUNNER_TEMP\TestResults\**\*.trx"
          /d:sonar.exclusions="**/bin/**,**/obj/**,**/TestResults/**,**/*.png,**/*.ico"
          /d:sonar.coverage.exclusions="tests/**,Behaviors/**,Controls/**,Localization/**"
          /d:sonar.cpd.exclusions="tests/**"

      - name: Test with coverage
        shell: pwsh
        run: >
          dotnet test src/UI.Wpf/tests/Dreamine.UI.Wpf.Tests/Dreamine.UI.Wpf.Tests.csproj
          --no-restore
          --configuration Release
          -m:1
          --collect:"XPlat Code Coverage"
          --settings src/UI.Wpf/.github/coverlet.runsettings
          --results-directory "$env:RUNNER_TEMP\TestResults"
          --logger "trx;LogFileName=tests.trx"

      - name: Pack
        shell: pwsh
        run: dotnet pack src/UI.Wpf/Dreamine.UI.Wpf.csproj --configuration Release --no-build --output "$env:RUNNER_TEMP\packages"

      - name: End SonarCloud analysis
        if: success() && env.SONAR_TOKEN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: pwsh
        run: dotnet sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
